<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Shop Catalog - Saber Haidari Mobile Shop</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css" rel="stylesheet">
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800&display=swap" rel="stylesheet">
    <style>
        body { font-family: 'Inter', sans-serif; }
        .glass-header { background: rgba(15, 23, 42, 0.85); backdrop-filter: blur(16px); }
        .card-hover { transition: all 0.3s ease; }
        .card-hover:hover { transform: translateY(-5px); box-shadow: 0 15px 30px -10px rgba(37, 99, 235, 0.25); }
    </style>
    <script src="theme.js"></script>
    <link rel="stylesheet" href="theme.css">
</head>
<body class="bg-slate-950 text-slate-100 min-h-screen flex flex-col justify-between">

    <!-- Header -->
    <header class="sticky top-0 z-50 glass-header border-b border-slate-800">
        <div class="max-w-7xl mx-auto px-4 sm:px-6 lg:px-8">
            <div class="flex items-center justify-between h-20">
                <a href="index.html" class="flex items-center gap-3">
                    <div class="w-11 h-11 rounded-xl bg-gradient-to-tr from-blue-600 to-indigo-500 flex items-center justify-center text-white shadow-lg shadow-blue-500/30">
                        <i class="fa-solid fa-mobile-screen-button text-xl"></i>
                    </div>
                    <div>
                        <span class="text-xl font-extrabold tracking-tight bg-gradient-to-r from-white via-slate-200 to-blue-400 bg-clip-text text-transparent">Saber Haidari</span>
                        <span class="block text-xs font-semibold text-blue-400 tracking-wider uppercase">Mobile Shop</span>
                    </div>
                </a>
                <nav class="hidden md:flex items-center gap-8 font-medium text-slate-300">
                    <a href="index.html" class="hover:text-blue-400 transition">Home</a>
                    <a href="shop.html" class="text-blue-400 font-semibold border-b-2 border-blue-500 pb-1">Shop Catalog</a>
                    <a href="contact.html" class="hover:text-blue-400 transition">Contact & Support</a>
                </nav>
                <div class="flex items-center gap-4">
                    <button onclick="toggleCart()" class="relative p-2.5 bg-slate-800 hover:bg-slate-700 text-slate-200 rounded-full border border-slate-700">
                        <i class="fa-solid fa-cart-shopping text-lg"></i>
                        <span id="cart-badge" class="absolute -top-1 -right-1 bg-blue-600 text-white text-xs font-bold w-5 h-5 rounded-full flex items-center justify-center">0</span>
                    </button>
                </div>
            </div>
            <nav class="md:hidden flex items-center justify-center gap-6 pb-3 text-sm font-medium text-slate-300">
                <a href="index.html" class="hover:text-blue-400">Home</a>
                <a href="shop.html" class="text-blue-400 font-semibold">Shop</a>
                <a href="contact.html" class="hover:text-blue-400">Contact</a>
            </nav>
        </div>
    </header>

    <!-- Main Shop Container -->
    <main class="max-w-7xl mx-auto px-4 sm:px-6 lg:px-8 py-10 flex-grow">
        <!-- Search & Filter Controls -->
        <div class="flex flex-col md:flex-row md:items-center justify-between gap-6 mb-10 bg-slate-900/60 p-6 rounded-3xl border border-slate-800">
            <div>
                <h1 class="text-2xl font-black text-white">Full Phone Catalog</h1>
                <p class="text-slate-400 text-sm mt-1">Filter by brand, search models, and find your dream smartphone.</p>
            </div>
            
            <div class="flex flex-col sm:flex-row items-center gap-4">
                <!-- Live Search Bar -->
                <div class="relative w-full sm:w-72">
                    <i class="fa-solid fa-magnifying-glass absolute left-4 top-3.5 text-slate-400"></i>
                    <input type="text" id="search-input" oninput="filterProducts()" placeholder="Search mobile model..." class="w-full bg-slate-950 border border-slate-700 rounded-2xl pl-11 pr-4 py-3 text-sm text-slate-100 placeholder-slate-500 focus:outline-none focus:border-blue-500">
                </div>
                
                <!-- Brand Select -->
                <select id="brand-select" onchange="filterProducts()" class="w-full sm:w-48 bg-slate-950 border border-slate-700 rounded-2xl px-4 py-3 text-sm text-slate-200 focus:outline-none focus:border-blue-500">
                    <option value="All">All Brands</option>
                    <option value="Apple">Apple iPhone</option>
                    <option value="Samsung">Samsung</option>
                    <option value="Google">Google Pixel</option>
                    <option value="Xiaomi">Xiaomi</option>
                </select>
            </div>
        </div>

        <!-- Product Grid -->
        <div id="catalog-grid" class="grid grid-cols-1 sm:grid-cols-2 lg:grid-cols-3 gap-8">
            <!-- Dynamic products injected here -->
        </div>
    </main>

    <!-- Quick View Modal -->
    <div id="quick-modal" class="fixed inset-0 z-50 invisible transition-all duration-300">
        <div class="absolute inset-0 bg-slate-950/80 backdrop-blur-md" onclick="closeModal()"></div>
        <div class="absolute top-1/2 left-1/2 -translate-x-1/2 -translate-y-1/2 w-full max-w-2xl bg-slate-900 border border-slate-800 rounded-3xl p-8 shadow-2xl z-10">
            <button onclick="closeModal()" class="absolute top-4 right-4 text-slate-400 hover:text-white p-2">
                <i class="fa-solid fa-xmark text-xl"></i>
            </button>
            <div id="modal-content">
                <!-- Modal info loaded via JS -->
            </div>
        </div>
    </div>

    <!-- Cart Drawer -->
    <div id="cart-drawer" class="fixed inset-0 z-50 invisible transition-all duration-300">
        <div class="absolute inset-0 bg-slate-950/80 backdrop-blur-sm" onclick="toggleCart()"></div>
        <div class="absolute right-0 top-0 bottom-0 w-full max-w-md bg-slate-900 border-l border-slate-800 p-6 flex flex-col justify-between shadow-2xl">
            <div>
                <div class="flex items-center justify-between pb-4 border-b border-slate-800">
                    <h3 class="text-xl font-bold text-white flex items-center gap-2">
                        <i class="fa-solid fa-bag-shopping text-blue-400"></i>
                        <span>Shopping Cart</span>
                    </h3>
                    <button onclick="toggleCart()" class="text-slate-400 hover:text-white p-2 text-xl">
                        <i class="fa-solid fa-xmark"></i>
                    </button>
                </div>
                <div id="cart-items" class="py-6 space-y-4 max-h-[60vh] overflow-y-auto"><p class="text-slate-400 text-sm text-center py-8">Your cart is currently empty.</p></div>
            </div>
            <div class="pt-4 border-t border-slate-800 space-y-4">
                <div class="flex items-center justify-between">
                    <span class="text-slate-400">Subtotal</span>
                    <span id="cart-subtotal" class="text-2xl font-black text-white">$0</span>
                </div>
                <button onclick="checkout()" class="w-full py-4 bg-gradient-to-r from-blue-600 to-indigo-600 text-white font-bold rounded-2xl shadow-lg hover:from-blue-500 hover:to-indigo-500 transition">
                    Checkout Now
                </button>
            </div>
        </div>
    </div>

    <footer class="bg-slate-950 border-t border-slate-800 py-8 text-center text-xs text-slate-500">
        © 2026 Saber Haidari Mobile Shop. All rights reserved.
    </footer>

    <script src="cart.js"></script>
    <script>
        const products = [
            { id: 1, title: 'iPhone 15 Pro Max', brand: 'Apple', price: 1199, storage: '256GB', ram: '8GB', img: 'https://images.unsplash.com/photo-1695048133142-1a20484d2569?auto=format&fit=crop&w=600&q=80', desc: 'Titanium build with A17 Pro Chip and groundbreaking zoom lens.' },
            { id: 2, title: 'Galaxy S24 Ultra', brand: 'Samsung', price: 1299, storage: '512GB', ram: '12GB', img: 'https://images.unsplash.com/photo-1610945265064-0e34e5519bbf?auto=format&fit=crop&w=600&q=80', desc: 'Built-in S Pen, Snapdragon 8 Gen 3, and full Galaxy AI suite.' },
            { id: 3, title: 'Google Pixel 8 Pro', brand: 'Google', price: 899, storage: '128GB', ram: '12GB', img: 'https://images.unsplash.com/photo-1598327105666-5b89351aff97?auto=format&fit=crop&w=600&q=80', desc: 'Advanced AI camera features with 7 years of Android updates.' },
            { id: 4, title: 'iPhone 15', brand: 'Apple', price: 799, storage: '128GB', ram: '6GB', img: 'https://images.unsplash.com/photo-1510557880182-3d4d3cba35a5?auto=format&fit=crop&w=600&q=80', desc: 'Dynamic Island, 48MP Main camera, and USB-C connectivity.' },
            { id: 5, title: 'Xiaomi 14 Ultra', brand: 'Xiaomi', price: 999, storage: '512GB', ram: '16GB', img: 'https://images.unsplash.com/photo-1565849904461-04a58ad377e0?auto=format&fit=crop&w=600&q=80', desc: 'Leica Quad Camera optics with 1-inch main sensor.' },
            { id: 6, title: 'Galaxy Z Fold 5', brand: 'Samsung', price: 1799, storage: '512GB', ram: '12GB', img: 'https://images.unsplash.com/photo-1580910051074-3eb694886505?auto=format&fit=crop&w=600&q=80', desc: 'Massive 7.6-inch main foldable screen for ultimate productivity.' }
        ];


        function renderProducts(items) {
            const grid = document.getElementById('catalog-grid');
            if (items.length === 0) {
                grid.innerHTML = '<p class="col-span-full text-center text-slate-400 py-16">No phones match your search.</p>';
                return;
            }
            grid.innerHTML = items.map(p => `
                <div class="bg-slate-900 border border-slate-800 rounded-3xl p-6 card-hover flex flex-col justify-between group">
                    <div>
                        <div class="relative bg-slate-950 rounded-2xl p-6 mb-6 flex justify-center items-center overflow-hidden">
                            <img src="${p.img}" alt="${p.title}" class="h-52 object-contain group-hover:scale-110 transition duration-500">
                        </div>
                        <p class="text-xs font-semibold text-blue-400 uppercase tracking-wider">${p.brand}</p>
                        <h3 class="text-xl font-bold text-white mt-1">${p.title}</h3>
                        <p class="text-slate-400 text-sm mt-2 line-clamp-2">${p.desc}</p>
                        
                        <div class="flex flex-wrap gap-2 mt-4">
                            <span class="px-2.5 py-1 bg-slate-800 text-slate-300 text-xs rounded-lg">${p.storage}</span>
                            <span class="px-2.5 py-1 bg-slate-800 text-slate-300 text-xs rounded-lg">${p.ram}</span>
                        </div>
                    </div>

                    <div class="mt-6 pt-4 border-t border-slate-800 flex items-center justify-between">
                        <div>
                            <p class="text-xs text-slate-400">Price</p>
                            <p class="text-2xl font-black text-white">$${p.price}</p>
                        </div>
                        <div class="flex items-center gap-2">
                            <button onclick="openModal(${p.id})" class="p-3 bg-slate-800 hover:bg-slate-700 text-slate-200 rounded-xl text-sm font-semibold transition" title="Quick View">
                                <i class="fa-solid fa-eye"></i>
                            </button>
                            <button onclick="addProduct(${p.id})" class="bg-blue-600 hover:bg-blue-500 text-white px-4 py-3 rounded-xl font-bold text-xs flex items-center gap-2 shadow-lg shadow-blue-600/30 transition">
                                <i class="fa-solid fa-cart-plus"></i>
                                <span>Add</span>
                            </button>
                        </div>
                    </div>
                </div>
            `).join('');
        }

        function addProduct(id) {
            const p = products.find(x => x.id === id);
            if (p) addToCart(p.title, p.price, p.brand);
        }

        function filterProducts() {
            const query = document.getElementById('search-input').value.toLowerCase();
            const brand = document.getElementById('brand-select').value;
            
            const filtered = products.filter(p => {
                const matchesSearch = p.title.toLowerCase().includes(query) || p.brand.toLowerCase().includes(query);
                const matchesBrand = brand === 'All' || p.brand === brand;
                return matchesSearch && matchesBrand;
            });

            renderProducts(filtered);
        }

        function openModal(id) {
            const p = products.find(prod => prod.id === id);
            const content = document.getElementById('modal-content');
            content.innerHTML = `
                <div class="flex flex-col md:flex-row gap-6">
                    <img src="${p.img}" class="h-64 object-contain mx-auto bg-slate-950 p-4 rounded-2xl border border-slate-800">
                    <div class="space-y-4">
                        <span class="text-xs font-semibold text-blue-400 uppercase tracking-widest">${p.brand}</span>
                        <h2 class="text-2xl font-black text-white">${p.title}</h2>
                        <p class="text-slate-400 text-sm leading-relaxed">${p.desc}</p>
                        <div class="flex gap-4">
                            <span class="bg-slate-800 px-3 py-1 rounded-lg text-xs font-semibold">Storage: ${p.storage}</span>
                            <span class="bg-slate-800 px-3 py-1 rounded-lg text-xs font-semibold">RAM: ${p.ram}</span>
                        </div>
                        <p class="text-3xl font-black text-white">$${p.price}</p>
                        <button onclick="addProduct(${p.id}); closeModal();" class="w-full py-3.5 bg-blue-600 text-white font-bold rounded-2xl hover:bg-blue-500 transition">
                            Add to Cart Now
                        </button>
                    </div>
                </div>
            `;
            document.getElementById('quick-modal').classList.remove('invisible');
        }

        function closeModal() {
            document.getElementById('quick-modal').classList.add('invisible');
        }

        // Initial Render (honour ?brand=Apple links from the home page)
        const brandParam = new URLSearchParams(location.search).get('brand');
        const brandSelect = document.getElementById('brand-select');
        if (brandParam && [...brandSelect.options].some(o => o.value === brandParam)) {
            brandSelect.value = brandParam;
        }
        filterProducts();
    </script>
</body>
</html>
